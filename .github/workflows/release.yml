name: Windows Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "ARCHIVER_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Install Inno Setup
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements

      - name: Generate app icon
        run: python packaging/make_icon.py

      - name: Download bundled tools (Tesseract, FFmpeg, Poppler, Ghostscript, qpdf)
        shell: pwsh
        run: pwsh packaging/download_tools.ps1

      - name: Download Whisper medium model
        run: python packaging/download_whisper_model.py

      - name: Build PyInstaller bundle
        run: python -m PyInstaller packaging/archiver.spec --noconfirm --distpath packaging/dist --workpath packaging/build

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          & packaging\dist\FileArchiver\FileArchiver.exe --help
          if ($LASTEXITCODE -ne 0) { throw "FileArchiver.exe --help failed" }

      - name: Package portable ZIP (without Whisper model)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "packaging\dist\FileArchiver\*" -DestinationPath "release\FileArchiver-Portable-$env:ARCHIVER_VERSION.zip"

      - name: Package Whisper medium model as separate release asset
        shell: pwsh
        run: |
          Compress-Archive -Path "packaging\tools\whisper-medium\*" -DestinationPath "release\whisper-medium-model.zip"

      - name: Build installer
        shell: pwsh
        env:
          ARCHIVER_VERSION: ${{ env.ARCHIVER_VERSION }}
          ARCHIVER_REPO: ${{ github.repository }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\installer.iss"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FileArchiver-Portable-${{ env.ARCHIVER_VERSION }}.zip
            release/FileArchiver-Setup-${{ env.ARCHIVER_VERSION }}.exe
            release/whisper-medium-model.zip
          generate_release_notes: true
